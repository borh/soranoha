requirements_version = 1

[[family]]
syntax_row_id = "annotation.chuuki"
review_status = "reviewed"
target_policy = "required"
evidence_ids = ["aozora-reference-chuuki-basic", "aozora-corpus-chuuki-pairs", "aozora-corpus-ruby-attached", "aozora-corpus-ruby-retarget", "aozora-corpus-ruby-reading-annotations", "aozora-corpus-inputter-note-reference", "aozora-corpus-named-witness-apparatus", "aozora-corpus-transcription-witness", "aozora-corpus-uncertain-correction", "aozora-corpus-explicit-base-corrections", "aozora-corpus-implicit-base-corrections", "aozora-corpus-omission-statements", "aozora-corpus-supplied-translations", "aozora-corpus-edition-register-locators", "aozora-corpus-attached-author-notes", "aozora-corpus-unclosed-edition-alternatives", "aozora-corpus-unquoted-mama-notes", "aozora-corpus-quoted-ruby-notes", "aozora-corpus-quoted-sic-stray-quote", "aozora-corpus-unquoted-sic-statements", "aozora-corpus-base-alternative-particles", "aozora-corpus-transcribed-right-notes", "aozora-corpus-error-questions", "aozora-corpus-attached-note-spellings", "aozora-corpus-base-correction-verbs", "aozora-corpus-base-edition-ruby-statements", "aozora-corpus-base-alternative-assertion-tails", "aozora-corpus-quoted-base-sic-statements"]
notes = "Resolving a numbered reference to its separately written definition is a structural obligation without executable coverage. The family inventory also contains editorial-statement forms."

[[family.obligation]]
id = "annotation.chuuki.paired-semantic"
aspect = "semantic-role"
statement = "A matched 注記付き range is represented as annotated principal text with separate note content."
required_cases = ["annotation.chuuki.paired_left_ruby", "annotation.chuuki.paired_rich_content"]
required_projections = ["aat", "tei"]

[[family.obligation]]
id = "annotation.chuuki.paired-boundaries"
aspect = "source-span"
statement = "A matched 注記付き range retains its distinct opening and closing source boundaries."
required_cases = ["annotation.chuuki.paired_left_ruby", "annotation.chuuki.paired_rich_content"]
required_projections = ["aat", "tei"]

[[family.obligation]]
id = "annotation.chuuki.rich-target"
aspect = "target"
statement = "Ruby and formatted principal ranges retain their semantic child structure inside the annotation."
required_cases = ["annotation.chuuki.attached_mixed_ruby_target", "annotation.chuuki.attached_tcy_target", "annotation.chuuki.paired_left_ruby", "annotation.chuuki.paired_rich_content"]
required_projections = ["aat", "tei"]

[[family.obligation]]
id = "annotation.chuuki.note-content"
aspect = "value"
statement = "Annotation text remains separate from principal text and preserves nested gaiji."
required_cases = ["annotation.chuuki.attached_mixed_ruby_target", "annotation.chuuki.attached_tcy_target", "annotation.chuuki.paired_left_ruby", "annotation.chuuki.paired_rich_content", "annotation.chuuki.attached_note_keyword_variants", "annotation.chuuki.bracketed_mama_note"]
required_projections = ["aat", "tei"]

[family.obligation.corpus_check]
partitions = ["form:attached-note"]
operands = '^［＃「(?P<target>[^「」［］《》｜※／＼]+)」に「(?P<note>[^「」［］《》｜※／＼]+)」の注記］$'
kind = "annotated_text"
text = { content = "{target}", annotation_content = "{note}" }
target_before_marker = "content"

[[family.obligation]]
id = "annotation.chuuki.paired-side"
aspect = "scope"
statement = "An explicitly left-side paired annotation retains its supplied placement."
required_cases = ["annotation.chuuki.paired_left_ruby"]
required_projections = ["aat", "tei"]

[[family.obligation]]
id = "annotation.chuuki.ruby-attached-target"
aspect = "target"
