operands = '^［＃(?P<text>「七夕」「真つすぐな街」は自由律俳句|読みは「つね」|括弧内は「染付」と「赤繪」の二行になっている|「諸国における富の分配」の図表のこと|ここに「下ニ詳ナリ」という注意書きが入る|「検察官」|「嘘の効用」|戯曲「赤藍色の島」|映画館名、「穂」|船名「香取丸」|宮本百合子の作品「赤い貨車」のナースチャのモデル|口語自由詩で、民衆の現実を描こうとした、「民衆派」の詩人|正しくは「All Quiet on the Western Front」|３つの「｛」は１つに繋がる|「｝一八〇」はこの後の５行にわたる|「ココ」は手描きの切符の下部の線に結ばれている|１字アキか改行か判然せず|この読点不適当|便箋右上に花飾り付きのページ数|列項目名２段目は１段目をそれぞれ２分割|列項目名は２段組、１段目|大熊信行|戦争終結の詔勅を放送|旅行案内書|日本プロレタリア・エスペランチスト同盟|武者小路実篤のペンネーム|波罫線|海野の別ペンネーム|行項目名のタイトル|金融緊急措置令。新円発行、旧円預金は封鎖|闇汁の図)］$'
kind = "editorial_note"
fields = { note_kind = "explanation", text = "{text}" }
marker_span = true

[[family.obligation]]
id = "source.reviewed_residual_command.transcription"
aspect = "semantic-role"
statement = "A statement of how the transcription departs from the source, such as ［＃罫線の部分は、「｛」「｝」で括る］, yields an editorial note of the kind transcription whose text is the bracket content."
required_cases = ["source.reviewed_residual_command.statements"]
required_projections = ["aat", "tei"]

[family.obligation.corpus_check]
partitions = []
operands = '^［＃(?P<text>原文は括弧「〔〕」を使うが、他の所と一致させるため改める|罫線の部分は、「｛」「｝」で括る)］$'
kind = "editorial_note"
fields = { note_kind = "transcription", text = "{text}" }
marker_span = true

