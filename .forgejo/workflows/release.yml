# Publish on the repository-scoped runner using the NixOS deployment config.
# The signing seed reaches only the release process through stdin; build children
# must not inherit it.
# Release exit 3 requests a retry from the new head; other failures stop the job.
# release-needed exit 10 indicates that nothing new is published, so no
# release is minted.
name: release
on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: soranoha-release
    steps:
      - name: check out the triggering commit
        # the dispatched SHA, not a floating branch: the job must execute
        # its own source even if main advances between dispatch and clone
        run: |
          helper='!f() { echo "username=x"; echo "password=${GITHUB_TOKEN}"; }; f'
          git -c credential.helper="$helper" clone "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" src
          git -C src fetch origin "$FORGEJO_SHA"
          git -C src checkout --detach "$FORGEJO_SHA"
          test "$(git -C src rev-parse HEAD)" = "$FORGEJO_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: check whether a release is needed
        # Compares candidate manifest inputs with the head manifest:
        # the stage coordinates of the publication stage set, the committed
        # snapshot, the rights policy, and the corpus. A corpus commit counts
        # only when a work archive or a published catalog row changed: about
        # 800 of aozorabunko's commits touch neither, and a release for one of
        # those costs a 9.1 MB manifest and a 14.45 MB catalog to record a
        # different revision. `corpus.covers_from` is what maps those revisions
        # to the release that covers them.
        # The head is verified before reading its manifest; any uncertainty
        # reports `needed`, so a skip occurs only on a verified comparison.
        run: |
          export PATH="/run/current-system/sw/bin:$PATH"
          set +e
          nix run ./src#soranoha-kernel -- release-needed \
            --deployment /etc/soranoha/publisher.json \
            --assets-root "$PWD/src/soranoha" \
            --assessment "$PWD/src/soranoha/data/assessment-snapshot.json" \
            --policy "$PWD/src/soranoha/data/publication-policy.edn"
          rc=$?
          set -e
          case "$rc" in
            0) : ;;
            10) echo "release: skipped, nothing new to publish" ; touch skip-release ;;
            *) exit "$rc" ;;
          esac

      - name: check the committed snapshot against the selection
        # A selection or assessment change that lands without regenerating
        # soranoha/data/assessment-snapshot.json stops the release with a
        # totality violation after the chain is already fetched and verified.
        # The same comparison here fails first, and names the slugs that
        # differ, so the fix is to regenerate and commit the snapshot.
        run: |
          test ! -f skip-release || { echo "skipping snapshot check (nothing new to publish)"; exit 0; }
          export PATH="/run/current-system/sw/bin:$PATH"
          nix run ./src#soranoha-kernel -- assessment-drift \
            --deployment /etc/soranoha/publisher.json \
            --assessment "$PWD/src/soranoha/data/assessment-snapshot.json" \
            --assessment-source "$PWD/src/soranoha/data/assessment-source.json" \
            --as-of "$(date -u +%F)"

      - name: release
        env:
          SORANOHA_RELEASE_SEED: ${{ secrets.SORANOHA_RELEASE_SEED }}
        run: |
          test ! -f skip-release || { echo "skipping release (nothing new to publish)"; echo skip > release.rc; exit 0; }
          export PATH="/run/current-system/sw/bin:$PATH"
          _soranoha_release_seed="$SORANOHA_RELEASE_SEED"
          export -n _soranoha_release_seed
          unset SORANOHA_RELEASE_SEED
          set +e
          printf '%s' "$_soranoha_release_seed" |
            env -u SORANOHA_RELEASE_SEED -u _soranoha_release_seed nix run ./src#soranoha-kernel -- release \
            --deployment /etc/soranoha/publisher.json \
            --assets-root "$PWD/src/soranoha" \
            --assessment "$PWD/src/soranoha/data/assessment-snapshot.json" \
            --assessment-source "$PWD/src/soranoha/data/assessment-source.json" \
            --as-of "$(date -u +%F)" \
            --policy "$PWD/src/soranoha/data/publication-policy.edn" \
            --release-key /dev/stdin
          rc=$?
          set -e
          echo "$rc" > release.rc
          case "$rc" in
            0) echo "release: published or already-published" ;;
            3) echo "release: requeue -- the next dispatched run retries from the new head" ;;
            *) exit "$rc" ;;
          esac

      - name: compare the new release's validation with its parent
        # The assembler rejects publication if validation regresses under an
        # unchanged TEI profile. Profile changes are exempt from this check
        # because reclassifying documents is expected, so this step lists
        # works newly invalid relative to the predecessor release and halts
        # before activation if regressions appear.
        # After review, activate by hand with
        # `serving-activate --deployment /etc/soranoha/publisher.json`.
        run: |
          test "$(cat release.rc)" = 0 || { echo "skipping validation comparison (requeue or nothing new to publish)"; exit 0; }
          export PATH="/run/current-system/sw/bin:$PATH"
          set +e
          nix run ./src#soranoha-kernel -- release-delta \
            --deployment /etc/soranoha/publisher.json \
            --fail-on-newly-invalid
          rc=$?
          set -e
          case "$rc" in
            0) : ;;
            11) echo "release: published but not activated, works became invalid; review the report above" ; exit 11 ;;
            *) exit "$rc" ;;
          esac

      - name: activate the verified serving tree
        run: |
          test "$(cat release.rc)" = 0 || { echo "skipping activation (requeue or nothing new to publish)"; exit 0; }
          export PATH="/run/current-system/sw/bin:$PATH"
          nix run ./src#soranoha-kernel -- serving-activate \
            --deployment /etc/soranoha/publisher.json
